  <rect x="552" y="348" width="28" height="7" rx="3.5" fill="#FFFFFF" opacity="0.85"/>
  <rect x="552" y="361" width="20" height="6" rx="3" fill="#94A3B8"/>

  <!-- Cursor pointer -->
  <g transform="translate(322,386)">
    <path d="M6 6 L6 32 L13 25 L17.5 34 L23 31.5 L18.5 23 L27 21.5 Z"
