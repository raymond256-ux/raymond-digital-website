  <rect x="452" y="34" width="130" height="120" rx="20" fill="url(#hdots)"/>
  <rect x="48" y="396" width="150" height="110" rx="20" fill="url(#hdots)"/>
  <rect x="524" y="368" width="26" height="26" rx="7" fill="url(#hg1)" opacity="0.85" transform="rotate(45 537 381)"/>
  <circle cx="82" cy="112" r="7" fill="#10B981" opacity="0.7"/>
  <rect x="30" y="200" width="14" height="14" rx="4" fill="#0EA5E9" opacity="0.35"/>

  <!-- Browser window -->
