  <rect x="265" y="274" width="46" height="7" rx="3.5" fill="#F59E0B"/>
  <rect x="317" y="274" width="72" height="7" rx="3.5" fill="#94A3B8"/>
  <rect x="251" y="292" width="80" height="7" rx="3.5" fill="#60A5FA"/>
  <rect x="337" y="292" width="32" height="7" rx="3.5" fill="#34D399"/>
  <rect x="251" y="310" width="54" height="7" rx="3.5" fill="#94A3B8"/>

