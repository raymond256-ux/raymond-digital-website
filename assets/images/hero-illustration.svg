<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Raymond Digital — web development and digital solutions</title>
  <desc id="heroDesc">A stylised website dashboard with analytics chart, code editor, approval badge and support tools.</desc>
  <defs>
    <linearGradient id="hg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="hg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123B70"/>
      <stop offset="1" stop-color="#071C3C"/>
    </linearGradient>
    <linearGradient id="hbar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="hshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0A2540" flood-opacity="0.15"/>
    </filter>
    <pattern id="hdots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#0A2540" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Backdrop decoration -->
  <circle cx="310" cy="285" r="235" fill="url(#hg1)" opacity="0.10"/>
