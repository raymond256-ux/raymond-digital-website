<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" role="img" aria-labelledby="abTitle abDesc">
  <title id="abTitle">About Raymond Digital — growth, planning and quality</title>
  <desc id="abDesc">Abstract composition of a progress report card, a checklist card and a growth statistic chip.</desc>
  <defs>
    <linearGradient id="ag1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="ag2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF8FF"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <filter id="ashadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0A2540" flood-opacity="0.14"/>
    </filter>
    <pattern id="adots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#0A2540" opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Backdrop -->
  <rect x="20" y="16" width="520" height="448" rx="30" fill="url(#ag2)"/>
  <rect x="380" y="40" width="140" height="110" rx="18" fill="url(#adots)"/>
  <circle cx="70" cy="420" r="60" fill="url(#ag1)" opacity="0.10"/>
  <circle cx="496" cy="300" r="8" fill="#10B981" opacity="0.55"/>
  <path d="M120 90 C 220 30, 340 30, 430 96" fill="none" stroke="#0EA5E9" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 8"/>

  <!-- Main progress card -->
  <g filter="url(#ashadow)">
    <rect x="158" y="88" width="280" height="306" rx="20" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="186" y="116" width="96" height="13" rx="6.5" fill="#0A2540"/>
  <rect x="186" y="138" width="150" height="8" rx="4" fill="#E2E8F0"/>

  <!-- Donut chart (72% complete) -->
  <g transform="translate(230,232)">
    <circle r="56" fill="none" stroke="#EEF2F7" stroke-width="17"/>
    <circle r="56" fill="none" stroke="url(#ag1)" stroke-width="17"
            stroke-linecap="round" stroke-dasharray="253.4 98.9"
            transform="rotate(-90)"/>
    <rect x="-26" y="-8" width="52" height="12" rx="6" fill="#0A2540"/>
    <rect x="-18" y="12" width="36" height="7" rx="3.5" fill="#CBD5E1"/>
  </g>

  <!-- Legend -->
  <circle cx="330" cy="196" r="5" fill="#06B6D4"/>
  <rect x="342" y="192" width="52" height="8" rx="4" fill="#E2E8F0"/>
  <circle cx="330" cy="222" r="5" fill="#10B981"/>
  <rect x="342" y="218" width="44" height="8" rx="4" fill="#E2E8F0"/>
  <circle cx="330" cy="248" r="5" fill="#15497F"/>
  <rect x="342" y="244" width="58" height="8" rx="4" fill="#E2E8F0"/>
  <circle cx="330" cy="274" r="5" fill="#CBD5E1"/>
  <rect x="342" y="270" width="38" height="8" rx="4" fill="#E2E8F0"/>

  <!-- Mini bars footer of card -->
  <rect x="186" y="322" width="16" height="40" rx="5" fill="#BAE6FD"/>
  <rect x="212" y="308" width="16" height="54" rx="5" fill="#67E8F9"/>
  <rect x="238" y="330" width="16" height="32" rx="5" fill="#A7F3D0"/>
  <rect x="264" y="296" width="16" height="66" rx="5" fill="url(#ag1)"/>

  <!-- Checklist card -->
  <g filter="url(#ashadow)">
    <rect x="34" y="56" width="172" height="164" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="54" y="76" width="76" height="11" rx="5.5" fill="#0A2540"/>
  <rect x="54" y="106" width="22" height="22" rx="6" fill="url(#ag1)" opacity="0.18"/>
  <path d="M59 117 l4.5 4.5 l8 -9" fill="none" stroke="#0EA5E9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="86" y="113" width="84" height="8" rx="4" fill="#CBD5E1"/>
  <rect x="54" y="142" width="22" height="22" rx="6" fill="url(#ag1)" opacity="0.18"/>
  <path d="M59 153 l4.5 4.5 l8 -9" fill="none" stroke="#0EA5E9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="86" y="149" width="70" height="8" rx="4" fill="#CBD5E1"/>
  <rect x="54" y="178" width="22" height="22" rx="6" fill="#EEF2F7"/>
  <rect x="86" y="185" width="78" height="8" rx="4" fill="#E2E8F0"/>

  <!-- Growth stat chip -->
  <g filter="url(#ashadow)">
    <rect x="382" y="330" width="148" height="86" rx="16" fill="#0A2540"/>
  </g>
  <polygon points="404,392 424,368 434,378 456,352" fill="none" stroke="#22D3EE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="456,352 466,350 462,360" fill="#22D3EE"/>
  <rect x="470" y="352" width="44" height="9" rx="4.5" fill="#FFFFFF" opacity="0.9"/>
  <rect x="470" y="370" width="34" height="8" rx="4" fill="#94A3B8"/>
  <circle cx="500" cy="398" r="4" fill="#10B981"/>

  <!-- Sparkle accents -->
  <path d="M120 250 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#06B6D4" opacity="0.5"/>
  <path d="M472 128 l3.4 8.4 l8.4 3.4 l-8.4 3.4 l-3.4 8.4 l-3.4 -8.4 l-8.4 -3.4 l8.4 -3.4 z" fill="#10B981" opacity="0.5"/>
</svg>
