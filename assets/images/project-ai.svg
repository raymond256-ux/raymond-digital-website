<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="paTitle">
  <title id="paTitle">AI automation project — connected workflow nodes</title>
  <defs>
    <linearGradient id="pa1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="pabg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04122B"/>
      <stop offset="1" stop-color="#0E3155"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#pabg)"/>
  <circle cx="352" cy="44" r="66" fill="#10B981" opacity="0.12"/>
  <circle cx="44" cy="256" r="58" fill="#06B6D4" opacity="0.12"/>

  <!-- network connections -->
  <g stroke="#22D3EE" stroke-opacity="0.45" stroke-width="2">
    <line x1="200" y1="150" x2="96" y2="84"/>
    <line x1="200" y1="150" x2="304" y2="84"/>
    <line x1="200" y1="150" x2="76" y2="196"/>
    <line x1="200" y1="150" x2="324" y2="196"/>
    <line x1="200" y1="150" x2="200" y2="52"/>
    <line x1="200" y1="150" x2="200" y2="244"/>
    <line x1="96" y1="84" x2="200" y2="52"/>
    <line x1="304" y1="84" x2="200" y2="52"/>
  </g>

  <!-- central AI chip -->
  <rect x="164" y="114" width="72" height="72" rx="16" fill="url(#pa1)"/>
  <rect x="182" y="132" width="36" height="36" rx="8" fill="#04122B"/>
  <text x="200" y="157" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">AI</text>
  <!-- chip pins -->
  <g stroke="#22D3EE" stroke-width="3" stroke-linecap="round">
    <line x1="182" y1="106" x2="182" y2="94"/><line x1="218" y1="106" x2="218" y2="94"/>
    <line x1="182" y1="194" x2="182" y2="206"/><line x1="218" y1="194" x2="218" y2="206"/>
    <line x1="156" y1="132" x2="144" y2="132"/><line x1="156" y1="168" x2="144" y2="168"/>
    <line x1="244" y1="132" x2="256" y2="132"/><line x1="244" y1="168" x2="256" y2="168"/>
  </g>

  <!-- satellite nodes -->
  <circle cx="96" cy="84" r="11" fill="#0A2540" stroke="#22D3EE" stroke-width="2.5"/>
  <circle cx="304" cy="84" r="11" fill="#0A2540" stroke="#34D399" stroke-width="2.5"/>
  <circle cx="76" cy="196" r="9" fill="#0A2540" stroke="#34D399" stroke-width="2.5"/>
  <circle cx="324" cy="196" r="9" fill="#0A2540" stroke="#22D3EE" stroke-width="2.5"/>
  <circle cx="200" cy="52" r="8" fill="#10B981"/>
  <circle cx="200" cy="244" r="8" fill="#22D3EE"/>

  <!-- workflow pills -->
  <rect x="52" y="128" width="70" height="20" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)"/>
  <rect x="64" y="135" width="46" height="6" rx="3" fill="#7DD3FC"/>
  <rect x="286" y="222" width="70" height="20" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)"/>
  <rect x="298" y="229" width="46" height="6" rx="3" fill="#6EE7B7"/>

  <!-- sparkles -->
  <path d="M330 130 l3.4 8.4 l8.4 3.4 l-8.4 3.4 l-3.4 8.4 l-3.4 -8.4 l-8.4 -3.4 l8.4 -3.4 z" fill="#34D399" opacity="0.55"/>
  <path d="M62 60 l2.8 7 l7 2.8 l-7 2.8 l-2.8 7 l-2.8 -7 l-7 -2.8 l7 -2.8 z" fill="#22D3EE" opacity="0.5"/>
</svg>
